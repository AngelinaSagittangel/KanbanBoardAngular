<div class="confirm-modal" (click)="cancel.emit()">
  <section
    class="confirm-modal__dialog"
    role="alertdialog"
    aria-modal="true"
    aria-labelledby="confirm-modal-title"
    aria-describedby="confirm-modal-description"
    (click)="$event.stopPropagation()"
  >
    @if (icon() !== 'none') {
      <div class="confirm-modal__icon">
        @switch (icon()) {
          @case ('delete') {
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M3 6h18"/>
              <path d="M8 6V4h8v2"/>
              <path d="m19 6-1 14H6L5 6"/>
              <path d="M10 11v5"/>
              <path d="M14 11v5"/>
            </svg>
          }
          @case ('leave') {
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M10 17l5-5-5-5"/>
              <path d="M15 12H3"/>
              <path d="M12 3h6a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3h-6"/>
            </svg>
          }
          @case ('member') {
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="9" cy="8" r="4"/>
              <path d="M3 21v-2a6 6 0 0 1 12 0v2"/>
              <path d="m16 11 5 5"/>
              <path d="m21 11-5 5"/>
            </svg>
          }
        }
      </div>
    }

    <h2 class="confirm-modal__title" id="confirm-modal-title">
      {{ title() }}
    </h2>

    <p
      class="confirm-modal__description"
      id="confirm-modal-description"
    >
      {{ description() }}
    </p>

    @if (error()) {
      <p class="confirm-modal__error" role="alert">
        {{ error() }}
      </p>
    }

    <div class="confirm-modal__actions">
      <button
        class="confirm-modal__button confirm-modal__button--cancel"
        type="button"
        [disabled]="loading()"
        (click)="cancel.emit()"
      >
        {{ cancelText() }}
      </button>

      <button
        class="confirm-modal__button"
        [class.confirm-modal__button--delete]="variant() === 'danger'"
        type="button"
        [disabled]="loading()"
        (click)="confirm.emit()"
      >
        {{ loading() ? loadingText() : confirmText() }}
      </button>
    </div>
  </section>
</div>
